name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Python tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # Datasets and trained weights are not in git: tests that need them skip themselves.
      - name: Unit, API and migration tests
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: python -m pytest -m "not e2e" -q
      - name: Migrations match the ORM
        run: |
          export QG_DATABASE_URL="sqlite:///$RUNNER_TEMP/ci.db"
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
